# Phase 2 sweeper — runs every 5 min via GitHub Actions.
# (Vercel Hobby allows only daily crons, so Vercel Cron can't do the 2-min
# sweep. This workflow calls the same Bearer-authenticated endpoint.)
# Required repo secrets: APP_URL (e.g. https://catarot.love), CRON_SECRET.
name: sweep-generating

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        run: |
          test -n "$APP_URL" || { echo "::error::APP_URL secret is missing (repo Settings → Secrets → Actions)"; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::CRON_SECRET secret is missing (repo Settings → Secrets → Actions)"; exit 1; }
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Sweep expired generating rows
        run: |
          BASE="${APP_URL%/}"
          RESP=$(curl -sf -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/sweep-generating")
          echo "$RESP"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
