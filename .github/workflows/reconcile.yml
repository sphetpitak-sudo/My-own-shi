# Phase 2 ledger reconcile — daily 03:00 Bangkok (20:00 UTC).
# Report-only: alerts on drift, never auto-fixes.
# Required repo secrets: APP_URL, CRON_SECRET (same as sweep.yml).
name: reconcile-ledger

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        run: |
          test -n "$APP_URL" || { echo "::error::APP_URL secret is missing (repo Settings → Secrets → Actions)"; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::CRON_SECRET secret is missing (repo Settings → Secrets → Actions)"; exit 1; }
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Reconcile ledger
        run: |
          curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reconcile-ledger"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
